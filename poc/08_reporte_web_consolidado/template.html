<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reporte consolidado — Interchange Change Monitor</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --border: #dde1e6;
    --text: #1c2128;
    --muted: #5b6472;
    --accent: #2f5fd6;
    --accent-bg: #eaf0ff;
    --warn-bg: #fff6e5;
    --warn-border: #f0c36d;
    --before: #b3251f;
    --after: #157a3d;
    --chip-bg: #eef1f5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 20px 24px 12px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  header h1 { margin: 0 0 4px; font-size: 20px; }
  header .muted { color: var(--muted); font-size: 13px; }
  nav#tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    padding: 10px 24px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
  }
  nav#tabs button {
    border: 1px solid var(--border);
    background: var(--chip-bg);
    color: var(--text);
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 13px;
    cursor: pointer;
  }
  nav#tabs button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  main {
    max-width: 980px;
    margin: 0 auto;
    padding: 20px 24px 60px;
  }
  .muted { color: var(--muted); }
  .grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
    margin-bottom: 16px;
  }
  .card h2 { margin: 0 0 4px; font-size: 17px; }
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: 10px 0 4px;
  }
  .chip {
    background: var(--chip-bg);
    border-radius: 6px;
    padding: 3px 9px;
    font-size: 12.5px;
    white-space: nowrap;
  }
  .chip.headline {
    background: var(--accent-bg);
    color: var(--accent);
    font-weight: 600;
  }
  button.chip {
    border: 1px solid var(--border);
    color: var(--text);
    font-family: inherit;
    cursor: pointer;
  }
  button.chip::after { content: " ▾"; color: var(--muted); }
  button.chip:hover { border-color: var(--accent); }
  button.chip.open {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  button.chip.open::after { content: " ▴"; color: #fff; }
  .chip-hint { font-size: 12px; margin: 2px 0 0; }
  .pill-detail {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    margin: 8px 0 4px;
    max-height: 420px;
    overflow-y: auto;
    font-size: 13px;
  }
  .pill-detail h4 {
    font-size: 13px;
    margin: 10px 0 4px;
    color: var(--muted);
  }
  .pill-detail h4:first-child { margin-top: 2px; }
  .pill-detail ul { margin: 0; padding-left: 18px; }
  .pill-detail li {
    margin-bottom: 3px;
    line-height: 1.4;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .top-list, .group-items { list-style: none; margin: 10px 0 0; padding: 0; }
  .top-list li { margin-bottom: 8px; }
  h3 {
    font-size: 14.5px;
    margin: 18px 0 8px;
    padding-bottom: 4px;
    border-bottom: 1px solid var(--border);
  }
  .item {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    margin-bottom: 8px;
    font-size: 13px;
    background: var(--panel);
  }
  .item.flagged {
    background: var(--warn-bg);
    border-color: var(--warn-border);
  }
  .item-loc { font-weight: 600; margin-bottom: 4px; }
  .item .before, .item .after, .item .reason {
    white-space: pre-wrap;
    margin-top: 2px;
    line-height: 1.4;
  }
  .item .before { color: var(--before); }
  .item .after { color: var(--after); }
  .item .reason { color: var(--muted); font-style: italic; }
  code {
    background: var(--chip-bg);
    padding: 1px 4px;
    border-radius: 4px;
    font-size: 12px;
  }
  table.legend {
    width: 100%;
    border-collapse: collapse;
    margin: 10px 0 4px;
    font-size: 13px;
  }
  table.legend th, table.legend td {
    text-align: left;
    padding: 6px 8px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  table.legend th {
    color: var(--muted);
    font-weight: 600;
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: .02em;
  }
  table.legend td:first-child { width: 34%; white-space: nowrap; }
  @media (max-width: 600px) {
    table.legend td:first-child { white-space: normal; width: auto; }
  }
</style>
</head>
<body>
<header>
  <h1>Reporte consolidado de cambios</h1>
  <div class="muted" id="generated-at"></div>
</header>
<nav id="tabs"></nav>
<main id="content"></main>

<script>
const DATA_B64 = "__DATA_B64__";

function b64ToUtf8(b64) {
  const binary = atob(b64);
  const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
  return new TextDecoder("utf-8").decode(bytes);
}

const DATA = JSON.parse(b64ToUtf8(DATA_B64));

function el(tag, opts, children) {
  opts = opts || {};
  children = children || [];
  const e = document.createElement(tag);
  if (opts.class) e.className = opts.class;
  if (opts.text !== undefined) e.textContent = opts.text;
  for (const child of children) e.appendChild(child);
  return e;
}

function fmtDate(edition) {
  if (!edition || edition.length < 8) return edition;
  return `${edition.slice(6, 8)}/${edition.slice(4, 6)}/${edition.slice(0, 4)}`;
}

function chip(label, value, isHeadline) {
  return el("span", { class: "chip" + (isHeadline ? " headline" : ""), text: `${label}: ${value}` });
}

// Contenido de lo agregado/eliminado detras de un pill secundario, agrupado por contexto
// (tabla, seccion, TC...) -las entradas ya vienen ordenadas por grupo desde el adaptador.
function renderPillDetail(pill) {
  const panel = el("div", { class: "pill-detail" });
  let list = null;
  let currentGroup = null;
  for (const d of pill.details) {
    if (list === null || d.group !== currentGroup) {
      currentGroup = d.group;
      if (d.group) panel.appendChild(el("h4", { text: d.group }));
      list = el("ul");
      panel.appendChild(list);
    }
    list.appendChild(el("li", { text: d.text }));
  }
  return panel;
}

// Pills secundarios con detalle: un clic abre su panel debajo de la fila de pills (uno a la
// vez por tarjeta), otro clic lo cierra. Los que valen 0 quedan como chip plano.
function renderSecondaryChips(chips, secondary) {
  let openBtn = null;
  let openPanel = null;
  let anyClickable = false;
  for (const s of secondary) {
    if (!s.details || !s.details.length) {
      chips.appendChild(chip(s.label, s.value, false));
      continue;
    }
    anyClickable = true;
    const btn = el("button", { class: "chip", text: `${s.label}: ${s.value}` });
    btn.addEventListener("click", () => {
      const wasOpen = openBtn === btn;
      if (openPanel) openPanel.remove();
      if (openBtn) openBtn.classList.remove("open");
      openBtn = openPanel = null;
      if (wasOpen) return;
      openPanel = renderPillDetail(s);
      const hint = chips.nextElementSibling;
      const anchor = hint && hint.classList.contains("chip-hint") ? hint : chips;
      anchor.insertAdjacentElement("afterend", openPanel);
      btn.classList.add("open");
      openBtn = btn;
    });
    chips.appendChild(btn);
  }
  return anyClickable;
}

function renderItem(item) {
  const wrap = el("div", { class: "item" + (item.flagged ? " flagged" : "") });
  wrap.appendChild(el("div", { class: "item-loc", text: (item.flagged ? "⚠️ " : "") + item.location }));
  if (item.before !== null && item.before !== undefined) {
    wrap.appendChild(el("div", { class: "before", text: "Antes: " + item.before }));
  }
  if (item.after !== null && item.after !== undefined) {
    wrap.appendChild(el("div", { class: "after", text: "Ahora: " + item.after }));
  }
  if (item.reason) {
    wrap.appendChild(el("div", { class: "reason", text: "Razón: " + item.reason }));
  }
  return wrap;
}

function renderGroups(groups) {
  const wrap = el("div");
  if (!groups.length) {
    wrap.appendChild(el("p", { class: "muted", text: "Sin cambios de negocio en este par de ediciones." }));
    return wrap;
  }
  for (const g of groups) {
    wrap.appendChild(el("h3", { text: `${g.group_title} (${g.items.length})` }));
    const list = el("div", { class: "group-items" });
    for (const item of g.items) list.appendChild(renderItem(item));
    wrap.appendChild(list);
  }
  return wrap;
}

function renderManualCard(m, opts) {
  const card = el("div", { class: "card" });
  card.appendChild(el("h2", { text: m.title }));
  card.appendChild(el("div", { class: "muted", text: `Edición ${fmtDate(m.edition_a)} → ${fmtDate(m.edition_b)}` }));

  const chips = el("div", { class: "chips" });
  chips.appendChild(chip(m.headline.label, m.headline.value, true));
  card.appendChild(chips);
  if (renderSecondaryChips(chips, m.secondary)) {
    card.appendChild(el("div", { class: "muted chip-hint", text: "Clic en un pill para ver su detalle." }));
  }

  if (opts && opts.compact) {
    if (m.top_items.length) {
      const ul = el("ul", { class: "top-list" });
      for (const item of m.top_items) {
        const li = el("li");
        li.appendChild(renderItem(item));
        ul.appendChild(li);
      }
      card.appendChild(ul);
    } else {
      card.appendChild(el("p", { class: "muted", text: "Sin destacados en este par de ediciones." }));
    }
  }
  return card;
}

function renderGeneralTab() {
  const wrap = el("div");
  const grid = el("div", { class: "grid" });
  for (const m of DATA.manuals) grid.appendChild(renderManualCard(m, { compact: true }));
  wrap.appendChild(grid);
  return wrap;
}

function renderManualTab(m) {
  const wrap = el("div");
  wrap.appendChild(renderManualCard(m, { compact: false }));
  wrap.appendChild(el("h2", { text: "Detalle completo de cambios de negocio" }));
  wrap.appendChild(renderGroups(m.groups));
  return wrap;
}

function renderRecentTab() {
  const wrap = el("div");
  const recent = DATA.manuals.filter(m => m.is_new_since_last_publish);
  if (!recent.length) {
    wrap.appendChild(el("p", { class: "muted", text: "Ningun manual tiene una edicion nueva desde la ultima publicacion." }));
    return wrap;
  }
  for (const m of recent) {
    wrap.appendChild(renderManualCard(m, { compact: false }));
    wrap.appendChild(el("h2", { text: "Detalle completo de cambios de negocio" }));
    wrap.appendChild(renderGroups(m.groups));
  }
  return wrap;
}

const LEGEND_SECTIONS = [
  {
    title: "Concepto universal (aparece en las 8 pestañas)",
    intro: "Es el pill principal de cada manual (a veces con otro nombre, ver \"BASE II Transactions\" mas abajo). Cuenta fragmentos que existen en AMBAS ediciones -mismo codigo/fila/ficha/parrafo/par ya emparejado entre la edicion vieja y la nueva- cuyo contenido cambio lo suficiente como para no ser identico, y que la IA clasifico como cambio real de negocio (a diferencia de \"solo redaccion\" o \"ruido de extraccion\", que existen pero no se cuentan aca). Todo lo demas de esta pagina es estructural y 100% deterministico -altas y bajas no necesitan IA porque \"¿existe o no existe en la otra edicion?\" es un hecho, no una interpretacion.",
    rows: [
      { term: "Cambios de negocio a revisar", def: "Cuantos fragmentos (de los que existen en ambas ediciones) cambiaron de forma que amerita revision humana." },
    ],
  },
  {
    title: "BASE II Clearing Data Codes",
    rows: [
      { term: "Altas", def: "Tablas nuevas + codigos nuevos, sumados." },
      { term: "Bajas", def: "Tablas eliminadas + codigos eliminados, sumados." },
      { term: "Tablas agregadas", def: "Una tabla de codigos completa (ej. \"Retired Chargeback Reason Codes\") que aparecio." },
      { term: "Tablas eliminadas", def: "Una tabla completa que desaparecio." },
    ],
  },
  {
    title: "BASE II Clearing Edit Package Messages",
    rows: [
      { term: "Fichas agregadas", def: "Una \"ficha\" (mensaje de edicion, ej. V0173) que aparecio." },
      { term: "Fichas eliminadas", def: "Una ficha que desaparecio." },
    ],
  },
  {
    title: "BASE II Clearing Interchange Formats (TC 01 a TC 49, y TC 50 a TC 92)",
    rows: [
      { term: "Transiciones Reserved↔definido", def: "Un rango de posiciones que era \"Reserved\" paso a ser un campo real (o al reves) -es el hallazgo central que motivo este proyecto." },
      { term: "Secciones agregadas", def: "Una seccion completa (grupo de posiciones/campos) que aparecio." },
      { term: "Secciones eliminadas", def: "Una seccion completa que desaparecio." },
    ],
  },
  {
    title: "Full Service POS Online Messages – Processing Specifications (International) y VisaNet Settlement Service (VSS), Volume 1",
    rows: [
      { term: "Secciones agregadas / eliminadas", def: "Un capitulo/seccion entero (por su ruta de encabezados) que aparecio/desaparecio." },
      { term: "Parrafos agregados / eliminados", def: "Un parrafo suelto, dentro de una seccion que SIGUE existiendo, que aparecio/desaparecio -no toda la seccion, solo ese parrafo." },
      { term: "Pares agregados / eliminados (solo VSS vol. 1)", def: "Un par \"Field Name / Description\" -una mini tabla de definicion de campo dentro de una seccion narrativa- que aparecio/desaparecio." },
    ],
  },
  {
    title: "VisaNet Settlement Service (VSS), Volume 2, Reports",
    rows: [
      { term: "Tablas agregadas / eliminadas", def: "Igual que en Data Codes: una tabla completa (dentro de uno de los 5 apendices) que aparecio/desaparecio." },
      { term: "Filas agregadas / eliminadas", def: "Una fila suelta dentro de una tabla que sigue existiendo." },
    ],
  },
  {
    title: "BASE II Transactions (Quick Reference) — caso especial, sin \"cambios de negocio\"",
    intro: "Este manual no usa IA: no hay redaccion libre que interpretar, solo altas/bajas de filas TCR. Por eso el pill principal es distinto.",
    rows: [
      { term: "Cambios de TCR (reemplaza a \"Cambios de negocio\")", def: "Total de filas TCR agregadas + eliminadas, en todos los TC." },
      { term: "TC agregados", def: "Un Transaction Code completo (ej. \"05 Sales Draft\") que aparecio." },
      { term: "TC eliminados", def: "Un TC completo que desaparecio." },
      { term: "TC afectados", def: "Cuantos TC tienen al menos 1 fila TCR agregada o eliminada, sin ser un alta/baja del TC entero." },
    ],
  },
];

function renderLegendTable(rows) {
  const table = el("table", { class: "legend" });
  const headRow = el("tr", {}, [
    el("th", { text: "Pill" }),
    el("th", { text: "Qué cuenta" }),
  ]);
  table.appendChild(el("thead", {}, [headRow]));
  const tbody = el("tbody");
  for (const r of rows) {
    tbody.appendChild(
      el("tr", {}, [
        el("td", {}, [el("strong", { text: r.term })]),
        el("td", { text: r.def }),
      ])
    );
  }
  table.appendChild(tbody);
  return table;
}

function renderGlossaryTab() {
  const wrap = el("div");
  wrap.appendChild(
    el("div", { class: "card" }, [
      el("h2", { text: "Leyenda de términos" }),
      el("p", {
        class: "muted",
        text: "Qué significa cada pill (chip de conteo) que aparece arriba de cada manual, agrupado por manual porque cada uno tiene su propia estructura de contenido (tablas, fichas, grillas de campos, párrafos narrativos, TCRs...).",
      }),
    ])
  );
  for (const sec of LEGEND_SECTIONS) {
    const cardChildren = [el("h2", { text: sec.title })];
    if (sec.intro) cardChildren.push(el("p", { class: "muted", text: sec.intro }));
    const card = el("div", { class: "card" }, cardChildren);
    card.appendChild(renderLegendTable(sec.rows));
    wrap.appendChild(card);
  }
  return wrap;
}

const recentCount = DATA.manuals.filter(m => m.is_new_since_last_publish).length;
const tabsDef = [
  { id: "recent", label: `Cambios recientes (${recentCount})`, render: renderRecentTab },
  { id: "general", label: "Resumen general", render: renderGeneralTab },
  { id: "legend", label: "Leyenda de términos", render: renderGlossaryTab },
].concat(
  DATA.manuals.map((m, i) => ({ id: "m" + i, label: m.title, render: () => renderManualTab(m) }))
);

const tabsEl = document.getElementById("tabs");
const contentEl = document.getElementById("content");

function selectTab(id) {
  contentEl.innerHTML = "";
  contentEl.appendChild(tabsDef.find(t => t.id === id).render());
  for (const btn of tabsEl.children) btn.classList.toggle("active", btn.dataset.tab === id);
}

for (const t of tabsDef) {
  const btn = el("button", { text: t.label });
  btn.dataset.tab = t.id;
  btn.addEventListener("click", () => selectTab(t.id));
  tabsEl.appendChild(btn);
}

document.getElementById("generated-at").textContent = "Generado " + DATA.generated_at;
selectTab("recent");
</script>
</body>
</html>
